<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIYOGISUBIZO Christian AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #123b70;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #123b70;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #answer {
      margin-top: 20px;
      padding: 15px;
      background: #eef3f9;
      border-radius: 12px;
      min-height: 50px;
    }
  </style>
</head>

<body>

<header>
  <h1>✝️ NIYOGISUBIZO Christian AI</h1>
  <p>Study • Ask • Translate • Learn</p>
</header>

<div class="container">
  <div class="card">
    <h2>Welcome to NIYOGISUBIZO Christian AI</h2>

    <textarea id="question"
      placeholder="Ask your question here..."></textarea>

    <button onclick="answerQuestion()">Ask NIYOGISUBIZO AI</button>

    <div id="answer">
      Your answer will appear here.
    </div>
  </div>
</div>

<script>
function answerQuestion() {
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");

  if (!question) {
    answer.innerHTML = "Please enter a question.";
    return;
  }

  answer.innerHTML =
    "Thank you for your question. NIYOGISUBIZO Christian AI is being prepared to give intelligent answers. 🤖✝️";
}
</script>

</body>
</html>
